<title>Oficina Quórum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral (vistas + áreas) | contenido; pie fijo con los motores. Identidad Quórum: hueso, azul noche, verde verificación. */
:root{
  --bg:#F8F7F3; --surface:#FFFFFF; --surface2:#EFEDE6; --line:#DDD9CF; --line2:#C4BFB2;
  --fg:#182B45; --fg2:#3A4A62; --muted:#6B7686;
  --accent:#147D68; --accent-ink:#0F6A58; --accent-soft:rgba(20,125,104,.12); --on-accent:#FFFFFF;
  --warn:#B7791F; --warn-soft:rgba(183,121,31,.14); --err:#C44242; --err-soft:rgba(196,66,66,.12);
  --info:#2F5FA8; --info-soft:rgba(47,95,168,.10);
  --a-direccion:#182B45; --a-protocolo:#147D68; --a-producto:#B7791F; --a-calidad:#2F5FA8;
  --shadow:0 12px 40px rgba(24,43,69,.14);
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101A2B; --surface:#182B45; --surface2:#213655; --line:#2C4262; --line2:#3E5578;
  --fg:#F1EFE8; --fg2:#C9CFD9; --muted:#8E9AAE;
  --accent:#2FA58C; --accent-ink:#4FC2A8; --accent-soft:rgba(47,165,140,.16); --on-accent:#07140F;
  --warn:#D9A14A; --warn-soft:rgba(217,161,74,.16); --err:#E06A6A; --err-soft:rgba(224,106,106,.16);
  --info:#8FB3F0; --info-soft:rgba(143,179,240,.14);
  --a-direccion:#A9BBD9; --a-protocolo:#4FC2A8; --a-producto:#D9A14A; --a-calidad:#8FB3F0;
  --shadow:0 12px 40px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101A2B; --surface:#182B45; --surface2:#213655; --line:#2C4262; --line2:#3E5578;
  --fg:#F1EFE8; --fg2:#C9CFD9; --muted:#8E9AAE;
  --accent:#2FA58C; --accent-ink:#4FC2A8; --accent-soft:rgba(47,165,140,.16); --on-accent:#07140F;
  --warn:#D9A14A; --warn-soft:rgba(217,161,74,.16); --err:#E06A6A; --err-soft:rgba(224,106,106,.16);
  --info:#8FB3F0; --info-soft:rgba(143,179,240,.14);
  --a-direccion:#A9BBD9; --a-protocolo:#4FC2A8; --a-producto:#D9A14A; --a-calidad:#8FB3F0;
  --shadow:0 12px 40px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-ui);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%;padding-bottom:64px}
.side{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - 64px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);font-weight:700;font-size:15px}
.brand b{display:block;font-size:14px;font-weight:600;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navlabel{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 10px 6px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer;text-align:left;color:var(--fg2)}
.navbtn:hover{background:var(--surface2);color:var(--fg)}
.navbtn[aria-current="true"]{background:var(--accent-soft);color:var(--fg)}
.navbtn .count{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.navbtn .count.hot{background:var(--err);color:#fff;border-radius:99px;padding:0 7px;font-weight:500}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--surface2);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 45%,transparent);background:none}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

main{min-width:0;padding-block:24px 40px;padding-inline:28px;display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.top h1{font-size:26px;font-weight:600}
.top p{margin:4px 0 0;color:var(--fg2)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--info-soft);color:var(--fg)}
.banner.warn{background:var(--warn-soft)}
.banner .grow{flex:1;min-width:200px}

.stats{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:99px;cursor:pointer;color:var(--fg2);font-size:13px}
.chip b{font-family:var(--f-mono);font-weight:500;color:var(--fg)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--fg)}

.section-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.section-h h2{font-size:16px;font-weight:600}
.section-h span{color:var(--muted);font-size:13px}

.list{display:flex;flex-direction:column;gap:10px}
.inbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px}
.inbox .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12px}
.inbox h3{font-size:15px;font-weight:600;cursor:pointer}
.inbox h3:hover{color:var(--accent-ink)}
.inbox .note{color:var(--fg2);grid-column:1/-1}
.inbox .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;justify-content:flex-end}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1}
.thumb{width:84px;height:84px;border-radius:10px;object-fit:cover;background:var(--surface2);border:1px solid var(--line);cursor:zoom-in;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:9px;display:block}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--fg2);white-space:nowrap}
.pill.toca{background:var(--err-soft);color:var(--err)}
.pill.work{background:var(--accent-soft);color:var(--accent-ink)}
.pill.block{background:var(--warn-soft);color:var(--warn)}
.pill.queue{background:var(--info-soft);color:var(--info)}
.pill.done{color:var(--muted)}
.pill.prio{font-family:var(--f-mono)}

.empty{border:1px dashed var(--line2);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-weight:600;margin-bottom:4px}

.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 4px;font-size:13px;font-weight:600}
.col-h span{font-family:var(--f-mono);color:var(--muted);font-weight:400}
.card{background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:10px 11px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.card:hover{border-color:var(--line2)}
.card b{font-weight:500;font-size:13.5px;line-height:1.35}
.card .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}

.areas{display:flex;flex-direction:column;gap:18px}
.area-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.area-h h2{font-size:16px;font-weight:600}
.area-h .mission{color:var(--muted);font-size:13px}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.agent{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.agent.dim{opacity:.72}
.agent-top{display:flex;gap:10px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;color:var(--bg)}
.agent-top b{display:block;font-weight:600;line-height:1.25}
.agent-top small{color:var(--muted);font-size:12px}
.agent p{margin:0;color:var(--fg2);font-size:13px}
.agent .now{font-size:12.5px;color:var(--accent-ink)}
.agent .acts{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}

.lib-tools{display:flex;gap:10px;flex-wrap:wrap}
.lib-tools input{flex:1;min-width:200px}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.doc:hover{border-color:var(--line2)}
.doc b{font-weight:600}
.doc p{margin:0;color:var(--fg2);font-size:13px}

.motors{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px;overflow-x:auto;z-index:5;min-height:64px}
.motors .lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.runner{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:13px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;background:var(--surface2)}
.runner .dot.live{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.runner .dot.sleep{background:var(--err)}
.runner small{color:var(--muted)}
.wakenote{margin-left:auto;color:var(--muted);font-size:12.5px;white-space:nowrap}

dialog{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:18px;padding:0;width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 50px)}
.dlg-h{display:flex;gap:12px;align-items:flex-start;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.dlg-h h2{font-size:18px;font-weight:600;flex:1}
.dlg-b{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px;min-height:0}
.dlg-f{padding:12px 20px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.x{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:8px}
.x:hover{color:var(--fg);background:var(--surface2)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:500;color:var(--fg2)}
.field small{color:var(--muted);font-size:12px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
input[type=text],input[type=search],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;min-height:40px}
textarea{min-height:96px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:8px 14px}
.checks label{display:flex;gap:6px;align-items:center;font-size:13px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.callout{padding:10px 12px;border-radius:10px;background:var(--surface2);color:var(--fg2);font-size:13.5px}
.callout.toca{background:var(--err-soft);color:var(--fg)}
.md{line-height:1.6;overflow-wrap:anywhere}
.md h1,.md h2,.md h3{margin:1em 0 .4em;font-size:1.08em}
.md table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;font-size:13px}
.md th,.md td{border:1px solid var(--line2);padding:5px 8px;text-align:left;vertical-align:top}
.md pre,.raw{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;font-family:var(--f-mono);font-size:12.5px;white-space:pre-wrap}
.md code{font-family:var(--f-mono);font-size:.9em}
.md li input[type=checkbox]{accent-color:var(--accent)}
.timeline{display:flex;flex-direction:column;gap:6px;font-size:13px}
.timeline div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px}
.timeline time{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.lightbox img{max-width:100%;max-height:calc(100vh - 160px);display:block;margin:auto;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Chat */
.chat{display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px;height:max(520px,calc(100vh - 190px))}
.ch-list{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.ch-list .navbtn{align-items:center}
.av.sm{width:28px;height:28px;font-size:11px}
.chn{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.chn small{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-main{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;min-width:0}
.ch-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ch-head span{color:var(--muted);font-size:12.5px}
.msgs{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start}
.msg .av{width:32px;height:32px;font-size:12px}
.msg .who{font-size:13px;font-weight:600}
.msg time{color:var(--muted);font-size:11.5px;margin-left:8px;font-weight:400;font-family:var(--f-mono)}
.msg .txt{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.daysep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11.5px}
.daysep::before,.daysep::after{content:"";flex:1;height:1px;background:var(--line)}
.tcard{margin-top:6px;border:1px solid var(--line2);background:var(--surface2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;max-width:460px;text-align:left;cursor:pointer;width:100%;color:inherit}
.tcard:hover{border-color:var(--accent)}
.tcard b{font-weight:600}
.tmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tdet{color:var(--fg2);font-size:13px}
.tthumbs{display:flex;gap:6px}
.tthumbs img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--surface)}
.composer{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.composer textarea{min-height:46px;max-height:160px}
.crow{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.cacts{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width: 860px){
  .chat{grid-template-columns:1fr;height:auto}
  .ch-list{flex-direction:row;overflow-x:auto}
  .ch-list .navbtn{width:auto;white-space:nowrap}
  .chn small{display:none}
  .ch-main{height:max(460px,calc(100vh - 320px))}
}
/* El mundo */
[hidden]{display:none!important}
.world{position:relative;height:max(520px,calc(100vh - 150px));border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface);touch-action:none;user-select:none}
.world canvas{display:block;width:100%;height:100%;cursor:grab}
.world canvas.drag{cursor:grabbing}
.w-ov{position:absolute;left:0;top:0;pointer-events:none;width:100%;height:100%;overflow:hidden}
.w-sign{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;display:flex;align-items:center;gap:6px;border:0;border-radius:99px;padding:5px 11px;font:600 12px var(--f-ui);color:#fff;white-space:nowrap;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.w-sign .b{background:var(--err);color:#fff;border-radius:99px;padding:0 6px;font:500 11px var(--f-mono)}
.w-sign.off{opacity:.55}
.w-label{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);font:500 11px var(--f-ui);color:var(--fg);white-space:nowrap}
.w-label .dot{width:7px;height:7px}
.w-panel{position:absolute;left:14px;top:14px;pointer-events:none;background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--line);border-radius:14px;padding:10px 14px;max-width:calc(100% - 28px)}
.w-panel b{display:block;font-size:15px;font-weight:600}
.w-panel span{color:var(--fg2);font-size:12.5px}
.w-chips{position:absolute;left:14px;bottom:14px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 140px)}
.w-chips .chip{background:color-mix(in srgb,var(--surface) 92%,transparent)}
.w-zoom{position:absolute;right:14px;bottom:14px;display:flex;gap:6px}
.w-zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-size:17px;display:grid;place-items:center}
.w-legend{position:absolute;right:14px;top:14px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;font-size:11.5px;color:var(--fg2);background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--line);border-radius:99px;padding:5px 12px}
.w-legend span{display:flex;align-items:center;gap:5px}
.w-tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:4px 9px;font-size:12px;white-space:nowrap;transform:translate(12px,12px)}
.w-pop{position:absolute;width:min(320px,calc(100% - 28px));background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:14px;box-shadow:var(--shadow);pointer-events:auto;display:flex;flex-direction:column;gap:10px}
.w-pop .now{background:var(--surface2);border-radius:10px;padding:9px 11px;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.w-pop .now b{font-weight:600}
.w-pop .now small{color:var(--fg2)}
.w-fallback{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:24px}
@media (max-width: 860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px 16px;gap:12px}
  .navgroup{flex-direction:row;overflow-x:auto;gap:4px}
  .navlabel{display:none}
  .navbtn{width:auto;white-space:nowrap}
  .side .encargar{width:100%}
  main{padding-inline:16px}
  .board{grid-template-columns:repeat(5,minmax(240px,82vw))}
  .inbox{grid-template-columns:1fr}
  .inbox .acts{justify-content:flex-start}
  .world{height:max(420px,calc(100vh - 300px))}
  .w-legend,.w-chips{display:none}
  .w-panel{padding:8px 12px}
  .w-panel b{font-size:14px}
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const TZ = "America/Caracas";
const S = {db:null, user:null, assets:null, meId:null, me:null, canEdit:false,
  depts:[], agents:[], people:[], tasks:[], docs:[], runners:[], ctx:{}, motor:{},
  view:"toca", chat:[], chatCh:"general", chatDraft:"", area:null, agentFilter:"activos", libQ:"", loaded:false};
const VIEWS = [
  {id:"mundo", label:"El mundo", icon:'<path d="M3 9l9-5 9 5-9 5z"/><path d="M3 9v6l9 5 9-5V9"/><path d="M12 14v6"/>'},
  {id:"toca", label:"Te toca", icon:'<path d="M4 13h4l2 3h4l2-3h4"/><path d="M5 5h14l1 8v6H4v-6z"/>'},
  {id:"chat", label:"Chat", icon:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>'},
  {id:"tablero", label:"Tablero", icon:'<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/>'},
  {id:"agentes", label:"Agentes", icon:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.8 3 2.6 3.5 5.2"/>'},
  {id:"biblioteca", label:"Biblioteca", icon:'<path d="M5 4h4v16H5zM10 4h4v16h-4z"/><path d="m15.5 5 3.8-1 2.2 15.4-3.8 1z"/>'}
];
const STATUS = {
  pendiente:{t:"En cola", c:"queue"}, cambios:{t:"Cambios pedidos", c:"queue"}, aprobada:{t:"Aprobada", c:"queue"},
  en_curso:{t:"Trabajando", c:"work"}, por_aprobar:{t:"Por aprobar", c:"toca"}, bloqueada:{t:"Bloqueada", c:"block"},
  hecha:{t:"Hecha", c:"done"}, descartada:{t:"Descartada", c:"done"}
};
const KINDS = {tarea:"Tarea", pregunta:"Pregunta", agente:"Agente", contenido:"Contenido", plan:"Plan", mensajes:"Mensajes", reporte:"Reporte"};
const DOC_KINDS = {guia:"Guía", checklist:"Checklist", plantilla:"Plantilla", faq:"FAQ", plan:"Plan", decisiones:"Decisiones", referencia:"Referencia", reporte:"Reporte"};

/* ---------- utilidades ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nowIso = () => new Date().toISOString();
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const slug = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60);
function fmt(iso){ if(!iso) return ""; try{ return new Intl.DateTimeFormat("es-VE",{timeZone:TZ,day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}).format(new Date(iso)); }catch(e){ return iso; } }
function ago(iso){
  if(!iso) return ""; const d = (Date.now() - new Date(iso).getTime())/60000;
  if(isNaN(d)) return ""; if(d < 1) return "ahora"; if(d < 60) return "hace " + Math.round(d) + " min";
  if(d < 1440) return "hace " + Math.round(d/60) + " h"; return fmt(iso);
}
function md(s){
  s = String(s || "");
  try{ if(window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(s, {gfm:true, breaks:true})); }catch(e){}
  return '<pre class="raw">' + esc(s) + "</pre>";
}
function ico(path){ return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">' + path + "</svg>"; }
const areaColor = id => "var(--a-" + (id || "x") + ", var(--muted))";
const dept = id => S.depts.find(d => d.id === id);
const agent = id => S.agents.find(a => a.id === id);
const person = id => S.people.find(p => p.id === id);
const personName = id => id === "cualquiera" ? "Cualquiera" : ((person(id) || {}).name || id || "—");
const initials = n => String(n || "?").split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
const isLive = r => r && r.last_seen && (Date.now() - new Date(r.last_seen).getTime()) < 20*60000;
function areaHasLiveMotor(areaId){ return S.runners.some(r => isLive(r) && (r.areas || []).some(a => a === "*" || a === areaId)); }
function myToca(){
  const pid = S.me && S.me.id;
  return S.tasks.filter(t => t.status === "por_aprobar" && (t.approval_for === "cualquiera" || (pid && t.approval_for === pid)));
}
function hist(t, text){ return (t.history || []).concat([{at: nowIso(), by: S.me ? S.me.id : "?", text}]).slice(-40); }
function pill(st, mine){ const s = STATUS[st] || {t: st, c: ""}; return '<span class="pill ' + s.c + '">' + esc(mine && st === "por_aprobar" ? "Te toca" : s.t) + "</span>"; }

/* ---------- aviso a los motores ---------- */
let lastWake = 0;
function note(t){ const n = $("#wakenote"); if(n) n.textContent = t; }
async function wake(text){
  let c = null; try{ c = await window.claude.use("comments"); }catch(e){}
  if(!c){ note("El motor lo toma en su próxima vuelta"); return; }
  let st = "off"; try{ st = await c.canSendToClaude(); }catch(e){}
  if(st !== "available"){ note("El motor lo toma en su próxima vuelta"); return; }
  if(Date.now() - lastWake < 10000){ note("Motor avisado hace un momento"); return; }
  lastWake = Date.now();
  text = String(text).slice(0, 900);
  try{
    let r = null; const tid = S.motor && S.motor.thread_id;
    if(tid){ try{ r = await c.sendToClaude({threadId: tid, text}); }catch(e){ if(e && e.code !== "not_found") throw e; } }
    if(!r){
      const anchor = await c.anchorFor($("#motor-anchor"));
      r = await c.sendToClaude({anchor, text: "Hilo de avisos para los motores de la oficina.\n" + text});
      await S.db.doc("system/motor").set(Object.assign({}, S.motor, {thread_id: r.threadId, updated_at: nowIso()}));
    }
    note("Motor avisado · " + fmt(nowIso()));
  }catch(e){ lastWake = 0; note("El motor lo toma en su próxima vuelta"); }
}

/* ---------- escritura ---------- */
async function updTask(t, patch, histText, wakeText){
  patch.updated_at = nowIso();
  if(histText) patch.history = hist(t, histText);
  try{ await S.db.doc("tasks/" + t.id).update(patch); }
  catch(e){ toast("No se pudo guardar: " + (e && e.message || "error")); return false; }
  if(wakeText) wake(wakeText);
  return true;
}
function toast(t){ note(t); }
async function uploadFiles(input, forWhat){
  const out = []; const files = input && input.files ? Array.from(input.files) : [];
  if(!files.length) return out;
  if(!S.assets){ toast("Adjuntar no está disponible en esta vista"); return out; }
  for(const f of files){
    try{ const r = await S.assets.upload(f); out.push({id: r.id, name: f.name, by: S.me ? S.me.id : null, at: nowIso(), for: forWhat}); }
    catch(e){ toast("No se pudo subir " + f.name + (e && e.code === "too_large" ? " (muy pesado)" : "")); }
  }
  return out;
}

/* ---------- render ---------- */
let rq = 0;
function render(){ if(rq) return; rq = requestAnimationFrame(() => { rq = 0; renderNow(); }); }
function renderNow(){ renderNav(); renderRunners(); const m = $("#main");
  const v = S.view; let html = "";
  if(v === "mundo" && S.db){ World.mount(m); World.update(); return; }
  if(World.isMounted()) m._html = null;
  World.unmount();
  if(!S.db) html = renderNoDb();
  else if(v === "toca") html = renderToca();
  else if(v === "tablero") html = renderBoard();
  else if(v === "agentes") html = renderAgents();
  else if(v === "biblioteca") html = renderLib();
  else if(v === "chat") html = renderChat();
  if(m._html === html && m.firstChild){ if(v === "chat") markRead(S.chatCh); return; }
  const ae = document.activeElement, keep = ae && ae.id && m.contains(ae) ? {id: ae.id, s: ae.selectionStart, e: ae.selectionEnd} : null;
  const msgs = $("#msgs"), atBottom = !msgs || msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 60, prevTop = msgs ? msgs.scrollTop : 0;
  m.innerHTML = html; m._html = html; bindMain();
  if(keep){ const n = document.getElementById(keep.id); if(n){ n.focus(); try{ n.setSelectionRange(keep.s, keep.e); }catch(e){} } }
  const nm = $("#msgs"); if(nm) nm.scrollTop = atBottom ? nm.scrollHeight : prevTop; }

function renderNav(){
  const toca = myToca().length + myTasks().length, chatN = S.me ? unreadTotal() : 0;
  const navHtml = '<div class="navlabel">Vistas</div>' + VIEWS.map(v => {
    const n = v.id === "toca" ? toca : v.id === "chat" ? chatN : 0;
    const cnt = n ? '<span class="count hot">' + n + "</span>" : "";
    return '<button class="navbtn" type="button" data-view="' + v.id + '" aria-current="' + (S.view === v.id) + '">' + ico(v.icon) + esc(v.label) + cnt + "</button>";
  }).join("");
  const nv = $("#nav-views"); if(nv._html !== navHtml){ nv.innerHTML = navHtml; nv._html = navHtml; }
  const depts = S.depts.slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  const na = $("#nav-areas"), areasHtml = '<div class="navlabel">Áreas</div>' +
    '<button class="navbtn" type="button" data-area="" aria-current="' + (!S.area) + '"><span class="dot" style="background:var(--fg2)"></span>Todas</button>' +
    depts.map(d => {
      const n = S.tasks.filter(t => t.dept === d.id && ["pendiente","cambios","aprobada","en_curso","por_aprobar","bloqueada"].includes(t.status)).length;
      return '<button class="navbtn" type="button" data-area="' + esc(d.id) + '" aria-current="' + (S.area === d.id) + '"><span class="dot" style="background:' + areaColor(d.id) + '"></span>' + esc(d.name) + (n ? '<span class="count">' + n + "</span>" : "") + "</button>";
    }).join("");
  if(na._html !== areasHtml){ na.innerHTML = areasHtml; na._html = areasHtml; }
}

function renderRunners(){
  const el = $("#runners"); if(!el) return;
  if(!S.runners.length){ el.innerHTML = '<span class="runner"><span class="dot sleep"></span>Ningún motor conectado todavía</span>'; return; }
  el.innerHTML = S.runners.map(r => {
    const live = isLive(r);
    const tip = (live ? "Vivo" : "Dormido") + " · último aviso " + (r.last_seen ? ago(r.last_seen) : "nunca") + " · áreas: " + ((r.areas || []).join(", ") || "—");
    return '<button class="runner" type="button" data-runner="' + esc(r.id) + '" title="' + esc(tip) + '"><span class="dot ' + (live ? "live" : "sleep") + '"></span>' + esc(r.name || r.id) + ' <small>' + esc(live ? (r.note || "Vivo") : "Dormido") + "</small></button>";
  }).join("");
}

function renderNoDb(){
  return '<div class="empty"><b>La oficina no puede abrir su base de datos en esta vista.</b>Ábrela desde claude.ai con tu cuenta. Si eres del equipo y sigues viendo esto, pídele a José acceso como editor.</div>';
}

function greet(){
  let h = 12; try{ h = Number(new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"numeric",hour12:false}).format(new Date())); }catch(e){}
  return h < 12 ? "Buenos días" : h < 19 ? "Buenas tardes" : "Buenas noches";
}
function claimBanner(){
  if(!S.loaded || S.me || !S.meId) return "";
  const free = S.people.filter(p => !p.user_id);
  if(!free.length) return '<div class="banner warn"><span class="grow">No encontramos tu nombre en el equipo de la oficina. Pídele a José que te agregue.</span></div>';
  return '<div class="banner"><span class="grow"><b>¿Quién eres?</b> Elige tu nombre para ver lo que te toca aprobar.</span>' +
    free.map(p => '<button class="btn sm" type="button" data-claim="' + esc(p.id) + '">' + esc(p.name) + "</button>").join("") + "</div>";
}
function areaWarn(){
  if(!S.area || !S.loaded) return "";
  if(areaHasLiveMotor(S.area)) return "";
  return '<div class="banner warn"><span class="grow">Ningún motor está atendiendo <b>' + esc((dept(S.area) || {}).name || S.area) + '</b> ahora. Lo que encargues aquí espera a que se encienda uno.</span></div>';
}
function inArea(t){ return !S.area || t.dept === S.area; }

function renderToca(){
  const mine = myToca().filter(inArea);
  const working = S.tasks.filter(t => t.status === "en_curso").length;
  const queued = S.tasks.filter(t => ["pendiente","cambios","aprobada"].includes(t.status)).length;
  const blocked = S.tasks.filter(t => t.status === "bloqueada").length;
  const active = S.agents.filter(a => a.status === "activo").length;
  const name = S.me ? S.me.name.split(" ")[0] : "";
  let html = '<div class="top"><div><h1>' + esc(greet()) + (name ? ", " + esc(name) : "") + '</h1><p>' +
    (S.loaded ? working + " agente" + (working === 1 ? "" : "s") + " trabajando · " + mine.length + " cosa" + (mine.length === 1 ? "" : "s") + " te necesita" + (mine.length === 1 ? "" : "n") : "Abriendo la oficina…") + "</p></div></div>";
  html += claimBanner() + areaWarn();
  html += '<div class="stats">' +
    '<button class="chip" type="button" data-goto="toca"><span class="dot" style="background:var(--err)"></span>Te toca <b>' + mine.length + "</b></button>" +
    '<button class="chip" type="button" data-goto="tablero"><span class="dot" style="background:var(--accent)"></span>Trabajando <b>' + working + "</b></button>" +
    '<button class="chip" type="button" data-goto="tablero"><span class="dot" style="background:var(--info)"></span>Esperan al motor <b>' + queued + "</b></button>" +
    '<button class="chip" type="button" data-goto="tablero"><span class="dot" style="background:var(--warn)"></span>Bloqueadas <b>' + blocked + "</b></button>" +
    '<button class="chip" type="button" data-goto="agentes"><span class="dot" style="background:var(--fg2)"></span>Agentes activos <b>' + active + "</b></button></div>";
  const mt = myTasks();
  if(mt.length) html += '<section><div class="section-h"><h2>Tus tareas</h2><span>Lo que el equipo te asignó</span></div><div class="list">' + mt.map(personTaskCard).join("") + "</div></section>";
  html += '<section><div class="section-h"><h2>Te toca</h2><span>Lo que espera tu visto bueno</span></div>';
  if(!S.loaded) html += '<div class="empty">Cargando…</div>';
  else if(!mine.length) html += '<div class="empty"><b>Nada pendiente por ahora.</b>Cuando un agente termine algo para ti, aparece aquí para que lo apruebes, pidas cambios o lo descartes.</div>';
  else html += '<div class="list">' + mine.sort((a, b) => (b.priority || 0) - (a.priority || 0) || String(a.updated_at).localeCompare(String(b.updated_at))).map(inboxCard).join("") + "</div>";
  html += "</section>";
  const recent = S.tasks.filter(t => inArea(t) && ["en_curso","bloqueada"].includes(t.status)).slice(0, 6);
  if(recent.length){
    html += '<section><div class="section-h"><h2>En marcha</h2><span>Lo que los agentes están haciendo o lo que se trabó</span></div><div class="list">' +
      recent.map(t => { const ag = agent(t.agent); const last = (t.activity || []).slice(-1)[0];
        return '<div class="inbox"><div><div class="meta">' + pill(t.status) + '<span>' + esc(ag ? ag.name : "Sin agente") + "</span><span>·</span><span>" + esc(ago(t.updated_at)) + '</span></div><h3 data-open="' + esc(t.id) + '">' + esc(t.title) + "</h3></div>" +
          (last ? '<div class="note">' + esc(last.text) + "</div>" : "") + "</div>"; }).join("") + "</div></section>";
  }
  return html;
}
function inboxCard(t){
  const ag = agent(t.agent); const d = dept(t.dept);
  const media = (t.media || []).slice(0, 8);
  const ro = t.read_only;
  const acts = t.kind === "pregunta"
    ? '<button class="btn primary sm" type="button" data-act="answer" data-id="' + esc(t.id) + '">Responder</button>'
    : (ro ? '<button class="btn primary sm" type="button" data-act="read" data-id="' + esc(t.id) + '">Marcar como leído</button>'
      : '<button class="btn primary sm" type="button" data-act="approve" data-id="' + esc(t.id) + '">Aprobar</button>' +
        '<button class="btn sm" type="button" data-act="changes" data-id="' + esc(t.id) + '">Pedir cambios</button>');
  return '<article class="inbox"><div><div class="meta"><span class="dot" style="background:' + areaColor(t.dept) + '"></span><span>' + esc(d ? d.name : t.dept || "") + "</span><span>·</span><span>" + esc(KINDS[t.kind] || t.kind || "Tarea") + "</span><span>·</span><span>" + esc(ag ? ag.name : "Oficina") + "</span><span>·</span><span>" + esc(ago(t.updated_at)) + "</span>" +
    (t.approval_for === "cualquiera" ? '<span class="pill">Para cualquiera</span>' : "") + '</div><h3 data-open="' + esc(t.id) + '">' + esc(t.title) + "</h3></div>" +
    '<div class="acts">' + acts + '<button class="btn ghost sm" type="button" data-open="' + esc(t.id) + '">Ver todo</button></div>' +
    (t.approval_note ? '<div class="note">' + esc(t.approval_note) + "</div>" : "") +
    (media.length ? '<div class="thumbs">' + media.map(m => '<button class="thumb" type="button" data-zoom="' + esc(m.id) + '" data-cap="' + esc(m.caption || "") + '" aria-label="Ver ' + esc(m.caption || "imagen") + '"><img src="/_blob/' + encodeURIComponent(m.id) + '" alt="' + esc(m.caption || "") + '" loading="lazy"></button>').join("") + "</div>" : "") +
    "</article>";
}

function renderBoard(){
  const cols = [
    {t:"En cola", s:["pendiente","cambios","aprobada"]},
    {t:"Trabajando", s:["en_curso"]},
    {t:"Por aprobar", s:["por_aprobar"]},
    {t:"Bloqueadas", s:["bloqueada"]},
    {t:"Hechas", s:["hecha"], lim:25}
  ];
  const pid = S.me && S.me.id;
  let html = '<div class="top"><div><h1>Tablero' + (S.area ? " · " + esc((dept(S.area) || {}).name || "") : "") + '</h1><p>Todas las tareas de la oficina por estado. Toca una para ver el detalle.</p></div></div>' + areaWarn();
  html += '<div class="board">' + cols.map(c => {
    let ts = S.tasks.filter(t => inArea(t) && c.s.includes(t.status));
    if(c.lim) ts = ts.slice(0, c.lim);
    return '<section class="col" aria-label="' + esc(c.t) + '"><div class="col-h">' + esc(c.t) + "<span>" + ts.length + "</span></div>" +
      (ts.length ? ts.map(t => { const ag = agent(t.agent);
        const waits = t.after && S.tasks.find(x => x.id === t.after && !["hecha","descartada"].includes(x.status));
        return '<button class="card" type="button" data-open="' + esc(t.id) + '"><b>' + esc(t.title) + '</b><div class="meta"><span class="dot" style="background:' + areaColor(t.dept) + '"></span>' + esc(ag ? ag.name : (t.assignee ? personName(t.assignee) : "Sin agente")) + (t.priority >= 2 ? ' <span class="pill prio">P' + esc(t.priority) + "</span>" : "") + "</div>" +
          '<div class="meta">' + pill(t.status, t.status === "por_aprobar" && (t.approval_for === pid || t.approval_for === "cualquiera")) + (waits ? '<span class="pill">Espera otra tarea</span>' : "") + "<span>" + esc(ago(t.updated_at)) + "</span></div></button>"; }).join("")
        : '<div class="empty" style="padding:14px;font-size:12.5px">Vacío</div>') + "</section>";
  }).join("") + "</div>";
  return html;
}

function agentState(a){
  if(a.status !== "activo") return a.status;
  const ts = S.tasks.filter(t => t.agent === a.id);
  if(ts.some(t => t.status === "por_aprobar")) return "te_toca";
  if(ts.some(t => t.status === "bloqueada")) return "bloqueado";
  if(ts.some(t => t.status === "en_curso")) return "trabajando";
  if(ts.some(t => ["pendiente","cambios","aprobada"].includes(t.status))) return "en_cola";
  return "libre";
}
const AGENT_STATE = {te_toca:["Espera aprobación","toca"], bloqueado:["Bloqueado","block"], trabajando:["Trabajando","work"], en_cola:["En cola","queue"], libre:["Libre",""], disponible:["Disponible","done"], por_crear:["Por crear","queue"], pausado:["Pausado","done"]};
function renderAgents(){
  const f = S.agentFilter;
  let html = '<div class="top"><div><h1>Agentes</h1><p>Los activos trabajan hoy. Los disponibles vienen del catálogo y los activa el dueño de cada área.</p></div>' +
    '<div class="stats">' + [["activos","Activos"],["disponibles","Disponibles"],["todos","Todos"]].map(x => '<button class="chip" type="button" data-afilter="' + x[0] + '" aria-pressed="' + (f === x[0]) + '">' + x[1] + "</button>").join("") +
    '<button class="btn sm" type="button" data-newagent="">' + ico('<path d="M12 5v14M5 12h14"/>') + "Nuevo agente</button></div></div>";
  const depts = S.depts.slice().sort((a, b) => (a.order || 0) - (b.order || 0)).filter(d => !S.area || d.id === S.area);
  if(!S.loaded) return html + '<div class="empty">Cargando…</div>';
  if(!depts.length) return html + '<div class="empty"><b>Todavía no hay áreas.</b>El motor las carga la primera vez que corre.</div>';
  html += '<div class="areas">' + depts.map(d => {
    let ags = S.agents.filter(a => a.dept === d.id);
    if(f === "activos") ags = ags.filter(a => a.status === "activo" || a.status === "por_crear");
    if(f === "disponibles") ags = ags.filter(a => a.status === "disponible" || a.status === "pausado");
    const RANK = {activo:0, por_crear:1, pausado:2, disponible:3, integrado:4};
    ags.sort((a, b) => (RANK[a.status] ?? 5) - (RANK[b.status] ?? 5) || (a.order || 99) - (b.order || 99) || String(a.name).localeCompare(String(b.name)));
    const owners = (d.owners || []).map(personName).join(", ");
    return '<section><div class="area-h"><span class="dot" style="background:' + areaColor(d.id) + '"></span><h2>' + esc(d.name) + '</h2><span class="mission">' + esc(d.mission || "") + (owners ? " · Dueño: " + esc(owners) : "") + "</span>" +
      (areaHasLiveMotor(d.id) ? "" : '<span class="pill block">Sin motor vivo</span>') + "</div>" +
      (ags.length ? '<div class="agents">' + ags.map(agentCard).join("") + "</div>" : '<div class="empty" style="padding:16px">Ningún agente en este filtro.</div>') + "</section>";
  }).join("") + "</div>";
  return html;
}

function readKey(ch){ return "oficina.chatLeido." + ch; }

async function act(kind, t){
  const who = S.me ? S.me.name.split(" ")[0] : "Alguien";
  if(kind === "approve"){ if(await updTask(t, {status:"aprobada"}, "Aprobó", who + ' aprobó "' + t.title + '"')) closeDlg(); return; }
  if(kind === "read"){ if(await updTask(t, {status:"hecha"}, "Lo marcó como leído", null)) closeDlg(); return; }
  if(kind === "discard"){
    dlg("Descartar", '<p>¿Descartar <b>' + esc(t.title) + '</b>? El agente no sigue con esto.</p><div class="field"><label for="why">Por qué (opcional)</label><textarea id="why" maxlength="1000"></textarea></div>',
      '<button class="btn ghost" type="button" data-close>Cancelar</button><button class="btn danger" type="button" id="go">Descartar</button>');
    $("#go").onclick = async () => { const w = $("#why").value.trim(); if(await updTask(t, {status:"descartada", feedback: w || null}, "Descartó" + (w ? ": " + w : ""), who + ' descartó "' + t.title + '"')) closeDlg(); };
    return;
  }
  if(kind === "changes"){
    dlg("Pedir cambios", '<p class="callout">' + esc(t.title) + '</p><div class="field"><label for="fb">Qué hay que cambiar</label><textarea id="fb" maxlength="3000" placeholder="Sé concreto: qué cambiar, qué dejar igual"></textarea></div><div class="field"><label for="fbimg">Imágenes de referencia (opcional)</label><input id="fbimg" type="file" accept="image/*" multiple></div>',
      '<button class="btn ghost" type="button" data-close>Cancelar</button><button class="btn primary" type="button" id="go">Enviar cambios</button>');
    $("#go").onclick = async ev => {
      const fb = $("#fb").value.trim(); if(!fb){ $("#fb").focus(); return; }
      ev.target.disabled = true;
      const imgs = await uploadFiles($("#fbimg"), "cambios");
      if(await updTask(t, {status:"cambios", feedback: fb, feedback_images: imgs.map(i => ({id: i.id, name: i.name}))}, "Pidió cambios: " + fb, who + ' pidió cambios en "' + t.title + '"')) closeDlg();
      else ev.target.disabled = false;
    };
    return;
  }
  if(kind === "answer"){
    dlg("Responder", '<div class="md">' + md(t.output || t.detail || t.title) + '</div><div class="field"><label for="ans">Tu respuesta</label><textarea id="ans" maxlength="3000"></textarea><small>Queda como decisión vigente: ningún agente vuelve a preguntarlo.</small></div>',
      '<button class="btn ghost" type="button" data-close>Cancelar</button><button class="btn primary" type="button" id="go">Responder</button>');
    $("#go").onclick = async () => { const a = $("#ans").value.trim(); if(!a){ $("#ans").focus(); return; }
      if(await updTask(t, {status:"aprobada", answer: a}, "Respondió: " + a, who + ' respondió "' + t.title + '"')) closeDlg(); };
    return;
  }
  if(kind === "pass"){
    const opts = S.people.filter(p => p.id !== (S.me && S.me.id)).map(p => '<option value="' + esc(p.id) + '">' + esc(p.name) + "</option>").join("") + '<option value="cualquiera">Cualquiera</option>';
    dlg("Pasar a otra persona", '<div class="field"><label for="to">Quién lo aprueba</label><select id="to">' + opts + "</select></div>",
      '<button class="btn ghost" type="button" data-close>Cancelar</button><button class="btn primary" type="button" id="go">Pasar</button>');
    $("#go").onclick = async () => { const to = $("#to").value; if(await updTask(t, {approval_for: to}, "Se lo pasó a " + personName(to), null)) closeDlg(); };
    return;
  }
  if(kind === "pstart"){ if(await updTask(t, {status:"en_curso", started_at: nowIso()}, "Empezó", null)) closeDlg(); return; }
  if(kind === "pdone"){
    if(await updTask(t, {status:"hecha"}, "La marcó como hecha", null)){ closeDlg(); if(t.chat_channel) sendChat("Terminé esta tarea ✓", {channel: t.chat_channel, kind: "tarea", task: t.id}); }
    return;
  }
  if(kind === "comment"){
    const c = $("#tcomment"); const txt = c ? c.value.trim() : ""; if(!txt){ if(c) c.focus(); return; }
    if(await updTask(t, {}, txt, who + ' comentó en "' + t.title + '"')){ c.value = ""; openTask(t.id); }
  }
}

function openDoc(id){
  const d = S.docs.find(x => x.id === id); if(!d) return;
  let html = md(d.body);
  const checks = d.checks || {};
  const wrap = document.createElement("div"); wrap.innerHTML = html;
  wrap.querySelectorAll('li input[type="checkbox"]').forEach(cb => {
    const li = cb.closest("li"); const key = checkKey(li ? li.textContent : "");
    cb.removeAttribute("disabled"); cb.dataset.key = key; cb.checked = !!(checks[key] && checks[key].done);
  });
  const by = d.updated_by ? " · " + esc(personName(d.updated_by) === d.updated_by ? d.updated_by : personName(d.updated_by)) : "";
  dlg(esc(d.title || d.id), '<div class="meta" style="display:flex;gap:6px;color:var(--muted);font-size:12.5px;flex-wrap:wrap"><span class="dot" style="background:' + areaColor(d.area) + '"></span>' + esc(DOC_KINDS[d.kind] || d.kind || "") + " · actualizado " + esc(fmt(d.updated_at)) + by + (d.version_note ? " · " + esc(d.version_note) : "") + "</div>" + '<div class="md" id="docbody">' + wrap.innerHTML + "</div>");
  $("#docbody").addEventListener("change", async ev => {
    const cb = ev.target; if(!cb.dataset || !cb.dataset.key) return;
    const patch = {checks: {}}; patch.checks[cb.dataset.key] = {done: cb.checked, by: S.me ? S.me.id : null, at: nowIso()};
    try{ await S.db.doc("docs/" + d.id).update(patch); }catch(e){ cb.checked = !cb.checked; toast("No se pudo guardar la casilla"); }
  });
}

    (statics.steam || []).forEach((s, i) => { const k = ((t * 0.5 + i / 3) % 1); s.position.y = 1.7 + k * 0.6; s.material.opacity = reduce.matches ? 0 : 0.5 * (1 - k); s.scale.setScalar(0.6 + k); });
    Object.entries(statics.veils).forEach(([id, v]) => { v.visible = areaAsleep(id); });
  }

  /* --- cámara --- */
  function fit(){
    if(!el) return;

    const R = 19, fov = camera.fov * Math.PI / 180, fovH = 2 * Math.atan(Math.tan(fov / 2) * aspect);
    cam.r = R / Math.sin(Math.min(fov, fovH) / 2) * (aspect < 1 ? 0.92 : 0.7); cam.tx = GW / 2; cam.tz = GD / 2 + 0.5; userCam = false; placeCam();

  function zoomBy(f){ cam.r *= f; userCam = true; placeCam(); }

  /* --- capa HTML --- */
  function project(x, y, z){ const v = new THREE.Vector3(x, y, z).project(camera); return {x: (v.x + 1) / 2 * el.clientWidth, y: (1 - v.y) / 2 * el.clientHeight, vis: v.z < 1}; }
  function buildOverlay(){
    ov.innerHTML = '<div class="w-panel" id="w-panel"><b></b><span></span></div>' +
      '<div class="w-legend" aria-hidden="true"><span><i class="dot" style="background:var(--accent)"></i>Trabajando</span><span><i class="dot" style="background:var(--err)"></i>Te toca</span><span><i class="dot" style="background:var(--warn)"></i>Bloqueado</span><span><i class="dot" style="background:var(--info)"></i>En cola</span><span><i class="dot"></i>Libre</span></div>' +
      '<div class="w-chips" id="w-chips" style="pointer-events:auto"></div>' +
      '<div class="w-zoom" style="pointer-events:auto"><button type="button" data-z="in" aria-label="Acercar">+</button><button type="button" data-z="out" aria-label="Alejar">−</button><button type="button" data-z="fit" aria-label="Encuadrar">⤢</button></div>' +
      '<div id="w-signs"></div><div id="w-labels"></div><div class="w-tip" id="w-tip" hidden></div><div class="w-pop" id="w-pop" hidden></div>';
    ov.querySelectorAll("[data-z]").forEach(b => b.onclick = () => { const z = b.dataset.z; if(z === "fit") fit(); else zoomBy(z === "in" ? 0.8 : 1.25); });
  }
  function signsData(){
    const out = [];
    const tocaArea = id => S.tasks.filter(t => t.dept === id && t.status === "por_aprobar").length;
    rooms.forEach(r => { const d = dept(r.id); out.push({key: "r" + r.id, x: r.rx + 4, y: 2.6, z: 0.6, text: d ? d.name : r.id, badge: tocaArea(r.id), color: tokens[r.id], off: areaAsleep(r.id), go: () => { S.area = r.id; S.view = "tablero"; render(); }}); });
    out.push({key: "rec", x: 4.5, y: 2.8, z: 18.5, text: "Recepción", badge: S.tasks.filter(t => t.status === "por_aprobar" && t.approval_for === "cualquiera").length, color: "#1E1E1E", go: () => { S.view = "toca"; render(); }});
    offices.forEach(o => { const p = person(o.pid); if(!p) return; const mine = S.me && S.me.id === o.pid; out.push({key: "o" + o.pid, x: o.x0 + 2, y: 2.1, z: 11.2, text: (mine ? "Tu oficina" : "Oficina de " + p.name.split(" ")[0]), badge: S.tasks.filter(t => t.status === "por_aprobar" && t.approval_for === o.pid).length, color: p.color || "#3D3D3D", go: () => { S.view = "toca"; render(); }}); });
    return out;
  }
  function placeOverlays(t){
    if(!ov) return;
    const sw = ov.querySelector("#w-signs"), lw = ov.querySelector("#w-labels");
    if(!sw._els) sw._els = {};
    const seen = new Set();
    signsData().forEach(s => {
      let b = sw._els[s.key];
      if(!b){ b = document.createElement("button"); b.type = "button"; b.className = "w-sign"; b.onclick = () => s.go(); sw.appendChild(b); sw._els[s.key] = b; }
      b.onclick = () => s.go();
      b.style.background = "linear-gradient(135deg," + s.color + "," + "color-mix(in srgb," + s.color + " 70%, #000))";
      b.classList.toggle("off", !!s.off);
      const html = esc(s.text) + (s.off ? " · dormida" : "") + (s.badge ? '<span class="b">' + s.badge + "</span>" : "");
      if(b._h !== html){ b.innerHTML = html; b._h = html; }
      const p = project(s.x, s.y, s.z); b.style.left = p.x + "px"; b.style.top = p.y + "px"; b.hidden = !p.vis; seen.add(s.key);
    });
    Object.keys(sw._els).forEach(k => { if(!seen.has(k)){ sw._els[k].remove(); delete sw._els[k]; } });
    const near = cam.r < 26;
    for(const ac of actors.values()){
      if(!ac.label){ ac.label = document.createElement("div"); ac.label.className = "w-label"; lw.appendChild(ac.label); }
      const a = ac.isPerson ? null : agent(ac.id);

      const color = ac.isPerson ? "var(--accent)" : ({te_toca: "var(--err)", trabajando: "var(--accent)", bloqueado: "var(--warn)", en_cola: "var(--info)"}[ac.state] || "var(--muted)");

  }
  function renderPanel(){
    if(!ov) return;

  }
  function currentTask(id){ return S.tasks.find(t => t.agent === id && t.status === "en_curso") || S.tasks.find(t => t.agent === id && t.status === "por_aprobar") || S.tasks.find(t => t.agent === id && t.status === "bloqueada") || S.tasks.find(t => t.agent === id && ["pendiente", "cambios", "aprobada"].includes(t.status)); }
  function doing(ac){ if(ac.plan && ac.plan.kind === "cafe") return "tomando café"; if(ac.talkUntil > performance.now() / 1000) return "conversando"; return ""; }
  function openPop(id, px, py){
    popId = id; const pop = ov.querySelector("#w-pop"); pop.hidden = false; pop._px = px; pop._py = py; fillPop(); positionPop();
  }
  function fillPop(){
    const pop = ov && ov.querySelector("#w-pop"); if(!pop || !popId) return;
    const a = agent(popId), ac = actors.get(popId); if(!a || !ac){ pop.hidden = true; popId = null; return; }
    const t = currentTask(a.id), d = dept(a.dept);
    const html = '<div class="agent-top"><div class="av" style="background:' + areaColor(a.dept) + '">' + esc(initials(a.name)) + '</div><div><b>' + esc(a.name) + "</b><small>" + esc(a.role || "") + " · " + esc(d ? d.name : "") + " · " + esc(STATE_LABEL[ac.state] || ac.state) + (doing(ac) ? " · " + doing(ac) : "") + "</small></div></div>" +
      (t ? '<div class="now"><b>Ahora: ' + esc(t.title) + "</b>" + (t.activity || []).slice(-3).map(x => "<small>" + esc(x.text) + "</small>").join("") + "</div>" : '<div class="now"><small>Sin tareas por ahora.</small></div>') +
      '<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sm ghost" type="button" data-wclose>Cerrar</button><button class="btn sm" type="button" data-agent="' + esc(a.id) + '">Ver ficha</button></div>';
    if(pop._h !== html){ pop.innerHTML = html; pop._h = html; const c = pop.querySelector("[data-wclose]"); if(c) c.onclick = () => { popId = null; pop.hidden = true; }; }
  }

    const pop = ov.querySelector("#w-pop"), ac = actors.get(popId); if(!ac) return;
    const p = project(ac.x + 0.5, 1.2, ac.z + 0.5), W = el.clientWidth, H = el.clientHeight, pw = pop.offsetWidth, ph = pop.offsetHeight;
    let left = Math.min(Math.max(14, p.x - pw / 2), W - pw - 14);
    let top = p.y - ph - 30; if(top < 14) top = Math.min(H - ph - 14, p.y + 40);

  }

  /* --- entrada --- */
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function pick(cx, cy){
    const r = cv.getBoundingClientRect(); ndc.set((cx - r.left) / r.width * 2 - 1, -(cy - r.top) / r.height * 2 + 1); ray.setFromCamera(ndc, camera);
    const objs = []; actors.forEach(a => objs.push(a.mesh)); statics.rackMeshes.forEach(m => objs.push(m)); statics.ghosts.forEach(g => objs.push(g));
    const hit = ray.intersectObjects(objs, true)[0]; if(!hit) return null;
    let o = hit.object; while(o){ if(o.userData && o.userData.actor) return {actor: o.userData.actor}; if(o.userData && o.userData.runner) return {runner: o.userData.runner}; if(o.userData && o.userData.ghost) return {ghost: o.userData.ghost.dept}; o = o.parent; }
    return null;
  }
  function bindInput(){
    cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); pointers.set(e.pointerId, {x: e.clientX, y: e.clientY}); if(pointers.size === 1) drag = {x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: false, pan: e.shiftKey || e.button === 2}; if(pointers.size === 2){ const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); } });
    cv.addEventListener("pointermove", e => {
      if(pointers.has(e.pointerId)) pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});

      if(drag && pointers.size === 1){

        if(Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 4){ drag.moved = true; cv.classList.add("drag"); }
        if(drag.moved){ if(drag.pan){ const k = cam.r * 0.0016; cam.tx -= (dx * Math.cos(cam.theta) + dy * Math.sin(cam.theta)) * k; cam.tz -= (-dx * Math.sin(cam.theta) + dy * Math.cos(cam.theta)) * k; } else { cam.theta -= dx * 0.008; cam.phi -= dy * 0.006; } userCam = true; placeCam(); }

      if(!h){ tip.hidden = true; return; }
      let txt = "";
      if(h.actor === "__me") txt = "Tú";
      else if(h.actor){ const a = agent(h.actor), ac = actors.get(h.actor), t = currentTask(h.actor); txt = (a ? a.name : "") + " · " + (STATE_LABEL[ac.state] || "") + (doing(ac) ? " · " + doing(ac) : "") + (t ? " · " + t.title : ""); }
      else if(h.runner){ const r = S.runners.find(r => r.id === h.runner); txt = (r ? r.name : "Motor") + " · " + (isLive(r) ? "vivo" : "dormido"); }
      else if(h.ghost) txt = "Escritorio libre · crear un agente";
      const r = el.getBoundingClientRect(); tip.textContent = txt; tip.style.left = (e.clientX - r.left) + "px"; tip.style.top = (e.clientY - r.top) + "px"; tip.hidden = false;
    });
    const up = e => {
      const wasDrag = drag && drag.moved; pointers.delete(e.pointerId); if(pointers.size < 2) pinch0 = 0;
      if(pointers.size === 0){ cv.classList.remove("drag"); if(drag && !wasDrag && e.type === "pointerup"){ const h = pick(e.clientX, e.clientY); if(h && h.actor && h.actor !== "__me") openPop(h.actor); else if(h && h.runner) openRunner(h.runner); else if(h && h.ghost) openAgentForm(null, h.ghost); else { popId = null; ov.querySelector("#w-pop").hidden = true; } } drag = null; }
    };
    cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
    cv.addEventListener("contextmenu", e => e.preventDefault());
    cv.addEventListener("wheel", e => { e.preventDefault(); const f = Math.exp(e.deltaY * 0.0015); cam.r *= f; userCam = true; placeCam(); }, {passive: false});
    cv.addEventListener("pointerleave", () => { const tip = ov.querySelector("#w-tip"); if(tip) tip.hidden = true; hoverKey = null; });
  }

  /* --- ciclo --- */
  function loop(ms){
    raf = requestAnimationFrame(loop);
    if(document.hidden) return;
    const t = ms / 1000, dt = Math.min(0.05, t - (lastT || t)); lastT = t;
    tick(t, dt); renderer.render(scene, camera); placeOverlays(t);
  }
  function init(){
    if(!window.THREE){ el.innerHTML = '<div class="w-fallback">No se pudo cargar la vista 3D. El resto de la oficina funciona igual: usa «Te toca» o el Tablero.</div>'; return false; }
    readTokens();
    cv = document.createElement("canvas"); cv.setAttribute("aria-label", "Vista 3D de la oficina: cada agente se mueve según el estado real de sus tareas"); cv.setAttribute("role", "img");
    ov = document.createElement("div"); ov.className = "w-ov";
    el.append(cv, ov);
    renderer = new THREE.WebGLRenderer({canvas: cv, antialias: true});
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(38, 1, 0.5, 300);
    scene.add(new THREE.HemisphereLight("#FFFFFF", "#445044", 0.75));
    sun = new THREE.DirectionalLight("#FFFFFF", 0.8); sun.position.set(GW / 2 + 14, 30, GD / 2 + 18); sun.target.position.set(GW / 2, 0, GD / 2);
    sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, {left: -24, right: 24, top: 20, bottom: -20, near: 1, far: 80}); sun.shadow.bias = -0.0006;
    scene.add(sun, sun.target);
    statics.clockCtx = document.createElement("canvas").getContext("2d"); statics.clockCtx.canvas.width = statics.clockCtx.canvas.height = 128;
    statics.clockTex = new THREE.CanvasTexture(statics.clockCtx.canvas);

    if(window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", retheme);
    new MutationObserver(retheme).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});

  }
  let sig = "";
  function rebuild(force){
    const s = JSON.stringify([S.agents.filter(a => ["activo", "pausado", "por_crear"].includes(a.status)).map(a => [a.id, a.dept, a.status, a.order]), S.runners.map(r => r.id), S.people.map(p => [p.id, p.color]), S.me && S.me.id]);

})();

/* ---------- arranque ---------- */
function snapArr(snap){ return snap.docs.map(d => Object.assign({id: d.id}, d.data())); }
async function boot(){
  render();
  let db = null, user = null;
  try{ [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); }catch(e){}
  S.db = db; S.user = user;
  if(user){ try{ S.meId = await user.id(); S.canEdit = await user.canEdit(); }catch(e){} }
  window.claude.use("assets").then(a => { S.assets = a; }).catch(() => {});
  if(!db){ S.loaded = true; render(); return; }
  let pending = 7; const done = () => { if(--pending <= 0){ S.loaded = true; } render(); };
  const onErr = e => { note("Conexión inestable con la base de datos"); };
  const once = fn => { let first = true; return snap => { fn(snap); if(first){ first = false; done(); } else render(); }; };
  db.collection("departments").onSnapshot(once(s => { S.depts = snapArr(s); }), onErr);
  db.collection("agents").onSnapshot(once(s => { S.agents = snapArr(s); }), onErr);
  db.collection("people").onSnapshot(once(s => { S.people = snapArr(s); S.me = S.people.find(p => p.user_id && p.user_id === S.meId) || null; }), onErr);
  db.collection("tasks").orderBy("updated_at", "desc").limit(500).onSnapshot(once(s => { S.tasks = snapArr(s); }), onErr);
  db.collection("docs").onSnapshot(once(s => { S.docs = snapArr(s); }), onErr);
  db.collection("runners").onSnapshot(once(s => { S.runners = snapArr(s); }), onErr);
  db.collection("chat").orderBy("at", "desc").limit(400).onSnapshot(once(s => { S.chat = snapArr(s); }), onErr);
  db.doc("system/contexto").onSnapshot(s => { S.ctx = s.exists ? s.data() : {}; render(); }, onErr);
  db.doc("system/motor").onSnapshot(s => { S.motor = s.exists ? Object.assign({}, s.data()) : {}; }, onErr);
  setInterval(render, 60000);
}
if(window.claude && window.claude.use) boot(); else { S.loaded = true; render(); }
})();
