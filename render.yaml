# Render Blueprint: todo Quórum (front + API) en un solo servicio Node con disco persistente.
# Push a `main` → deploy automático. Ver docs/DEPLOY_RENDER.md.
services:
  - type: web
    name: quorum
    runtime: node
    plan: standard
    region: virginia
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm i -g pnpm@10.18.0 && pnpm install --frozen-lockfile && pnpm --filter @quorum/web build
    startCommand: pnpm --filter @quorum/web start
    healthCheckPath: /
    disk:
      name: quorum-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATA_DIR
        value: /var/data
      - key: NEXT_PUBLIC_CHAIN_ID
        value: "84532"
      - key: BASE_SEPOLIA_RPC
        value: https://sepolia.base.org
      - key: NEXT_PUBLIC_REGISTRY_ADDRESS
        value: "0x64e7cbf3b1a334a6633f0025d289335aeda8be13"
      - key: NEXT_PUBLIC_ZERODEV_PROJECT_ID
        value: 498afc93-bf5c-4233-b0f0-919bccd0001b
      - key: NEXT_PUBLIC_QUORUM_ONCHAIN_CAST
        value: "false"
      - key: INVITE_CHANNEL
        value: dry-run
      - key: INVITE_SEND_APPROVED
        value: "false"
      # Secretos: FACE_KEY se genera en Render; ORGANIZER_PRIVATE_KEY se pega a mano en el dashboard (nunca en git).
      - key: FACE_KEY
        generateValue: true
      - key: ORGANIZER_PRIVATE_KEY
        sync: false
